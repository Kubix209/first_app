<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja Studenta</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background: #f5f5f5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 300px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .btn {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .nav {
            margin-bottom: 20px;
        }

        .nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #2196F3;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="nav">
    <a href="/students">📚 Studenci</a>
    <a href="/teachers">👨‍🏫 Nauczyciele</a>
    <a href="/lessons">📅 Lekcje</a>
</div>

<h1>📝 Rejestracja Studenta</h1>

<form th:action="@{/students/create}" method="post">
    <div class="form-group">
        <label for="firstName">Imię:</label>
        <input type="text" id="firstName" name="firstName" required>
    </div>

    <div class="form-group">
        <label for="lastName">Nazwisko:</label>
        <input type="text" id="lastName" name="lastName" required>
    </div>

    <div class="form-group">
        <label for="language">Język programowania:</label>
        <select id="language" name="language" required>
            <option value="">-- Wybierz język --</option>
            <option th:each="lang : ${languages}"
                    th:value="${lang}"
                    th:text="${lang}">
            </option>
        </select>
    </div>

    <div class="form-group">
        <label for="teacherId">Nauczyciel:</label>
        <select id="teacherId" name="teacherId" required disabled>
            <option value="">-- Najpierw wybierz język --</option>
        </select>
    </div>

    <button type="submit" id="saveButton" class="btn" disabled>
        Zapisz
    </button>

    <a href="/students" style="margin-left: 10px;">Anuluj</a>
</form>

<script>
    const languageSelect = document.getElementById('language');
    const teacherSelect = document.getElementById('teacherId');
    const saveButton = document.getElementById('saveButton');

    let latestRequestId = 0;

    async function populateTeachers() {
        const requestId = ++latestRequestId;
        const language = languageSelect.value;

        teacherSelect.disabled = true;
        saveButton.disabled = true;
        teacherSelect.replaceChildren(
            new Option('-- Najpierw wybierz język --', '')
        );

        if (!language) {
            return;
        }

        teacherSelect.replaceChildren(
            new Option('-- Ładowanie nauczycieli --', '')
        );

        try {
            const response = await fetch(
                `/teachers?language=${encodeURIComponent(language)}`
            );

            if (!response.ok) {
                throw new Error('Nie udało się pobrać nauczycieli');
            }

            const teachers = await response.json();

            // Pomijamy odpowiedź, jeśli użytkownik zmienił już język.
            if (requestId !== latestRequestId) {
                return;
            }

            if (teachers.length === 0) {
                teacherSelect.replaceChildren(
                    new Option('-- Brak nauczycieli dla tego języka --', '')
                );
                return;
            }

            teacherSelect.replaceChildren(
                new Option('-- Wybierz nauczyciela --', '')
            );

            teachers.forEach(teacher => {
                teacherSelect.add(
                    new Option(
                        `${teacher.firstName} ${teacher.lastName}`,
                        teacher.id
                    )
                );
            });

            teacherSelect.disabled = false;
        } catch (error) {
            if (requestId !== latestRequestId) {
                return;
            }

            teacherSelect.replaceChildren(
                new Option('-- Błąd pobierania. Wybierz język ponownie --', '')
            );
        }
    }

    languageSelect.addEventListener('change', populateTeachers);

    teacherSelect.addEventListener('change', function () {
        saveButton.disabled = !teacherSelect.value;
    });

    populateTeachers();
</script>

</body>
</html>
